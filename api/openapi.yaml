openapi: 3.0.3
info:
  title: Go Monolith Frame API
  version: 1.0.0
  description: |
    Go Monolith Frame 是一个基于 Gin + GORM 的 Go 单体应用框架。
    采用清晰的分层架构设计：Handler 层、Service 层、Repository 层、Model 层。

    ## 认证说明
    除了健康检查、登录和创建用户接口外，其他接口都需要 JWT 认证。
    请求头格式：`Authorization: Bearer {token}`

    ## 错误码规范
    - `SYS_*` - 系统级错误
    - `USER_*` - 用户模块错误

    ## 响应格式
    ### 成功响应
    ```json
    {
      "success": true,
      "data": { ... },
      "pagination": { ... },
      "meta": {
        "timestamp": "2026-02-05T10:00:00Z",
        "requestId": "xxx"
      }
    }
    ```

    ### 错误响应
    ```json
    {
      "success": false,
      "error": {
        "code": "USER_NOT_FOUND",
        "message": "用户不存在",
        "details": { ... }
      },
      "meta": {
        "timestamp": "2026-02-05T10:00:00Z",
        "requestId": "xxx"
      }
    }
    ```

  contact:
    name: API Support
    email: support@example.com

servers:
  - url: http://localhost:8080
    description: 本地开发环境
  - url: http://api.example.com
    description: 生产环境

tags:
  - name: Health
    description: 健康检查
  - name: Auth
    description: 认证相关
  - name: Users
    description: 用户管理

paths:
  /health:
    get:
      tags:
        - Health
      summary: 健康检查
      description: 检查服务是否正常运行
      security: []
      responses:
        '200':
          description: 服务正常
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Response'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/HealthData'
              example:
                success: true
                data:
                  status: ok
                  time: 1704067200
                meta:
                  timestamp: "2026-02-05T10:00:00Z"
                  requestId: "req-123456"

  /api/v1/users/login:
    post:
      tags:
        - Auth
      summary: 用户登录
      description: 使用邮箱和密码登录，返回 JWT Token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            examples:
              normal:
                summary: 正常登录
                value:
                  email: user@example.com
                  password: password123
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Response'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/LoginResponse'
              example:
                success: true
                data:
                  token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                  expiresAt: 1704067200
                  user:
                    id: 1
                    username: johndoe
                    email: user@example.com
                    status: 1
                meta:
                  timestamp: "2026-02-05T10:00:00Z"
                  requestId: "req-123456"
        '200':
          description: 密码错误或用户被禁用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                password_error:
                  summary: 密码错误
                  value:
                    success: false
                    error:
                      code: USER_INVALID_PASSWORD
                      message: 密码错误
                    meta:
                      timestamp: "2026-02-05T10:00:00Z"
                      requestId: "req-123456"
                user_disabled:
                  summary: 用户被禁用
                  value:
                    success: false
                    error:
                      code: USER_DISABLED
                      message: 用户已禁用
                    meta:
                      timestamp: "2026-02-05T10:00:00Z"
                      requestId: "req-123456"

  /api/v1/users:
    post:
      tags:
        - Users
      summary: 创建用户
      description: 创建新用户账号
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
            examples:
              normal:
                summary: 正常创建用户
                value:
                  username: johndoe
                  email: user@example.com
                  password: password123
      responses:
        '200':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'
              example:
                success: true
                data: null
                meta:
                  timestamp: "2026-02-05T10:00:00Z"
                  requestId: "req-123456"
        '200':
          description: 参数错误或用户已存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalid_params:
                  summary: 参数错误
                  value:
                    success: false
                    error:
                      code: SYS_INVALID_PARAMS
                      message: 参数错误
                    meta:
                      timestamp: "2026-02-05T10:00:00Z"
                      requestId: "req-123456"
                user_exists:
                  summary: 用户已存在
                  value:
                    success: false
                    error:
                      code: USER_EXISTS
                      message: 用户已存在
                    meta:
                      timestamp: "2026-02-05T10:00:00Z"
                      requestId: "req-123456"

    get:
      tags:
        - Users
      summary: 查询用户列表
      description: 分页查询用户列表，支持按关键词搜索
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          required: true
          description: 页码，从1开始
          schema:
            type: integer
            minimum: 1
            default: 1
            example: 1
        - name: page_size
          in: query
          required: true
          description: 每页数量
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
            example: 10
        - name: keyword
          in: query
          description: 搜索关键词（匹配用户名或邮箱）
          schema:
            type: string
            example: john
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/UserResponse'
              example:
                success: true
                data:
                  - id: 1
                    username: johndoe
                    email: user@example.com
                    status: 1
                  - id: 2
                    username: janedoe
                    email: jane@example.com
                    status: 1
                pagination:
                  total: 100
                  page: 1
                  pageSize: 10
                  totalPages: 10
                meta:
                  timestamp: "2026-02-05T10:00:00Z"
                  requestId: "req-123456"
        '200':
          description: 参数错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/users/{id}:
    get:
      tags:
        - Users
      summary: 获取用户详情
      description: 根据用户ID获取用户信息
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: 用户ID
          schema:
            type: integer
            format: int64
            example: 1
      responses:
        '200':
          description: 获取成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Response'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/UserResponse'
              example:
                success: true
                data:
                  id: 1
                  username: johndoe
                  email: user@example.com
                  status: 1
                meta:
                  timestamp: "2026-02-05T10:00:00Z"
                  requestId: "req-123456"
        '200':
          description: 用户不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error:
                  code: USER_NOT_FOUND
                  message: 用户不存在
                meta:
                  timestamp: "2026-02-05T10:00:00Z"
                  requestId: "req-123456"

    put:
      tags:
        - Users
      summary: 更新用户信息
      description: 更新指定用户的信息
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: 用户ID
          schema:
            type: integer
            format: int64
            example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
            examples:
              normal:
                summary: 更新用户信息
                value:
                  username: johndoe_updated
                  email: newemail@example.com
                  status: 1
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'
        '200':
          description: 参数错误或用户不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      tags:
        - Users
      summary: 删除用户
      description: 软删除指定用户
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: 用户ID
          schema:
            type: integer
            format: int64
            example: 1
      responses:
        '200':
          description: 删除成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'
        '200':
          description: 参数错误或用户不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/users/{id}/password:
    patch:
      tags:
        - Users
      summary: 修改用户密码
      description: 修改指定用户的密码
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: 用户ID
          schema:
            type: integer
            format: int64
            example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
            examples:
              normal:
                summary: 修改密码
                value:
                  old_password: oldpass123
                  new_password: newpass456
      responses:
        '200':
          description: 修改成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'
        '200':
          description: 参数错误、旧密码错误或用户不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                password_wrong:
                  summary: 旧密码错误
                  value:
                    success: false
                    error:
                      code: USER_INVALID_PASSWORD
                      message: 密码错误
                    meta:
                      timestamp: "2026-02-05T10:00:00Z"
                      requestId: "req-123456"
                unauthorized:
                  summary: 只能修改自己的密码
                  value:
                    success: false
                    error:
                      code: SYS_UNAUTHORIZED
                      message: 只能修改自己的密码
                    meta:
                      timestamp: "2026-02-05T10:00:00Z"
                      requestId: "req-123456"

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT 认证，从登录接口获取 token

  schemas:
    # 基础响应结构
    Response:
      type: object
      required:
        - success
        - meta
      properties:
        success:
          type: boolean
          description: 请求是否成功
          example: true
        data:
          type: object
          nullable: true
          description: 响应数据
          example: null
        meta:
          $ref: '#/components/schemas/MetaInfo'

    # 分页响应结构
    PaginatedResponse:
      type: object
      required:
        - success
        - meta
      properties:
        success:
          type: boolean
          description: 请求是否成功
          example: true
        data:
          type: object
          nullable: true
          description: 响应数据
        pagination:
          $ref: '#/components/schemas/PaginationInfo'
        meta:
          $ref: '#/components/schemas/MetaInfo'

    # 错误响应结构
    ErrorResponse:
      type: object
      required:
        - success
        - meta
      properties:
        success:
          type: boolean
          description: 请求是否成功
          example: false
        error:
          $ref: '#/components/schemas/ErrorInfo'
        meta:
          $ref: '#/components/schemas/MetaInfo'

    # 错误信息
    ErrorInfo:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: 错误码
          example: USER_NOT_FOUND
        message:
          type: string
          description: 错误信息
          example: 用户不存在
        details:
          type: object
          description: 错误详情
          example: null

    # 分页信息
    PaginationInfo:
      type: object
      required:
        - total
        - page
        - pageSize
        - totalPages
      properties:
        total:
          type: integer
          format: int64
          description: 总记录数
          example: 100
        page:
          type: integer
          description: 当前页码
          example: 1
        pageSize:
          type: integer
          description: 每页数量
          example: 10
        totalPages:
          type: integer
          description: 总页数
          example: 10

    # 元信息
    MetaInfo:
      type: object
      required:
        - timestamp
        - requestId
      properties:
        timestamp:
          type: string
          format: date-time
          description: 响应时间戳 (RFC3339)
          example: "2026-02-05T10:00:00Z"
        requestId:
          type: string
          description: 请求ID，可通过请求头 X-Request-ID 指定
          example: "req-123456"

    # 健康检查数据
    HealthData:
      type: object
      required:
        - status
        - time
      properties:
        status:
          type: string
          description: 服务状态
          example: ok
        time:
          type: integer
          format: int64
          description: 当前时间戳
          example: 1704067200

    # 用户响应
    UserResponse:
      type: object
      required:
        - id
        - username
        - email
        - status
      properties:
        id:
          type: integer
          format: int64
          description: 用户ID
          example: 1
        username:
          type: string
          description: 用户名
          example: johndoe
        email:
          type: string
          format: email
          description: 邮箱
          example: user@example.com
        status:
          type: integer
          description: 用户状态，0=禁用，1=启用
          enum: [0, 1]
          example: 1

    # 登录响应
    LoginResponse:
      type: object
      required:
        - token
        - expiresAt
        - user
      properties:
        token:
          type: string
          description: JWT Token
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VyX2lkIjoxLCJ1c2VybmFtZSI6ImpvaG5kb2UiLCJleHAiOjE3MDQwNjcyMDB9.SflKxwRJSMeKKF2QT4fwpMeJf36POk6yJV_adQssw5c
        expiresAt:
          type: integer
          format: int64
          description: 过期时间戳（秒）
          example: 1704067200
        user:
          $ref: '#/components/schemas/UserResponse'

    # 请求模型
    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          description: 邮箱地址
          example: user@example.com
        password:
          type: string
          minLength: 6
          maxLength: 20
          description: 密码
          example: password123

    CreateUserRequest:
      type: object
      required:
        - username
        - email
        - password
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 20
          description: 用户名
          example: johndoe
        email:
          type: string
          format: email
          description: 邮箱地址
          example: user@example.com
        password:
          type: string
          minLength: 6
          maxLength: 20
          description: 密码
          example: password123

    UpdateUserRequest:
      type: object
      required:
        - username
        - email
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 20
          description: 用户名
          example: johndoe
        email:
          type: string
          format: email
          description: 邮箱地址
          example: user@example.com
        status:
          type: integer
          description: 用户状态，0=禁用，1=启用
          enum: [0, 1]
          example: 1

    ChangePasswordRequest:
      type: object
      required:
        - old_password
        - new_password
      properties:
        old_password:
          type: string
          minLength: 6
          maxLength: 20
          description: 旧密码
          example: oldpass123
        new_password:
          type: string
          minLength: 6
          maxLength: 20
          description: 新密码
          example: newpass456

    # 错误码枚举
    ErrorCode:
      type: string
      description: 错误码
      enum:
        - SUCCESS                    # 成功
        - SYS_SERVER_ERROR          # 服务器内部错误
        - SYS_INVALID_PARAMS        # 参数错误
        - SYS_NOT_FOUND            # 资源不存在
        - SYS_UNAUTHORIZED         # 未授权
        - SYS_FORBIDDEN           # 禁止访问
        - SYS_TOO_MANY_REQUESTS    # 请求过于频繁
        - SYS_TIMEOUT             # 请求超时
        - USER_NOT_FOUND          # 用户不存在
        - USER_EXISTS             # 用户已存在
        - USER_INVALID_PASSWORD   # 密码错误
        - USER_DISABLED           # 用户已禁用
        - USER_INVALID_TOKEN      # 无效的Token
        - USER_TOKEN_EXPIRED     # Token已过期
